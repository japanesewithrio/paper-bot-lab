name: Paper Bot Lab backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt tabulate matplotlib
      - name: Safety check
        run: |
          if grep -nE 'submit_order|MarketOrderRequest|LimitOrderRequest|StopOrderRequest|StopLimitOrderRequest' bot_runner.py backtest.py; then
            echo "Broker order code detected. Stopping."; exit 1
          fi
      - name: Run backtest (simulation only)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python backtest.py
      - name: Save report
        run: |
          git config user.name "paper-bot-lab[bot]"
          git config user.email "paper-bot-lab[bot]@users.noreply.github.com"
          git add reports/backtest.md reports/backtest.png
          git commit -m "Backtest report [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
