name: Paper Bot Lab

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 13-22 * * 1-5"

permissions:
  contents: write
  actions: write

concurrency:
  group: paper-bot-lab
  cancel-in-progress: false

jobs:
  run-paper-bots:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap project
        shell: bash
        run: |
          if [ -f bot_runner.py ]; then
            echo "Bot project already installed."
            exit 0
          fi

          if [ ! -f paper-bot-lab-production.zip ]; then
            echo "Missing paper-bot-lab-production.zip"
            exit 1
          fi

          TMP_DIR="$(mktemp -d)"
          unzip -q paper-bot-lab-production.zip -d "$TMP_DIR"

          mkdir -p tests reports

          cp "$TMP_DIR/bot_runner.py" .
          cp "$TMP_DIR/bot_state.json" .
          cp "$TMP_DIR/requirements.txt" .
          cp "$TMP_DIR/README.md" .
          cp "$TMP_DIR/tests/test_strategies.py" tests/
          cp "$TMP_DIR/reports/latest.md" reports/

          git config user.name "paper-bot-lab[bot]"
          git config user.email "paper-bot-lab[bot]@users.noreply.github.com"

          git add bot_runner.py bot_state.json requirements.txt README.md
          git add tests/test_strategies.py reports/latest.md

          if ! git diff --cached --quiet; then
            git commit -m "Install Paper Bot Lab"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Check Alpaca secrets
        id: secrets
        shell: bash
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ -n "$ALPACA_API_KEY" ] && [ -n "$ALPACA_SECRET_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Add ALPACA_API_KEY and ALPACA_SECRET_KEY in GitHub Actions secrets."
          fi

      - name: Set up Python
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Safety check
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          if grep -nE \
            'submit_order|MarketOrderRequest|LimitOrderRequest|StopOrderRequest|StopLimitOrderRequest' \
            bot_runner.py market_clock.py
          then
            echo "Broker order code detected. Stopping."
            exit 1
          fi

          echo "Simulation-only safety check passed."

      - name: Run tests
        if: steps.secrets.outputs.ready == 'true'
        run: python -m pytest -q

      # GitHub drops most scheduled runs (11/2026: some days none at all), so the bot keeps itself alive:
      # each run works (or waits for the next open) for up to ~5h40m, then starts the next run itself
      # (workflow_dispatch is allowed with GITHUB_TOKEN). The schedule above only restarts the chain if it ever breaks.
      - name: Run Paper Bot Lab (relay run)
        if: steps.secrets.outputs.ready == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        shell: bash
        run: |
          git config user.name "paper-bot-lab[bot]"
          git config user.email "paper-bot-lab[bot]@users.noreply.github.com"
          start=$(date +%s)
          end=$(( start + 340 * 60 ))
          runs=0
          while [ "$(date +%s)" -lt "$end" ]; do
            status="$(python market_clock.py || echo ERROR)"
            left=$(( end - $(date +%s) ))
            echo "$(date -u +%H:%M) market: $status (run time left ${left}s)"
            case "$status" in
              OPEN) ;;
              WAIT*)
                w=$(( ${status#WAIT } + 60 ))
                if [ "$w" -lt "$left" ]; then sleep "$w"; continue; fi
                sleep "$left"; break ;;
              *) sleep 120; continue ;;
            esac
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
            python bot_runner.py || echo "bot_runner failed (will try again next round)"
            runs=$((runs + 1))
            if ! git diff --quiet -- bot_state.json reports/latest.md; then
              git add bot_state.json reports/latest.md
              git commit -q -m "Update Paper Bot Lab state [skip ci]"
              git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" || echo "push failed"
            fi
            now=$(date +%s)
            sleep $(( 1800 - now % 1800 + 30 ))     # next :00 / :30 (+30 s)
          done
          echo "bot rounds this run: $runs"
          echo "ran_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Start the next relay run
        if: always() && steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # never chain runs that ended quickly (that would loop on an error)
          if [ "${ran_seconds:-0}" -ge 1800 ]; then
            gh workflow run paper-bots.yml --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}" && echo "next relay run started"
          else
            echo "run lasted ${ran_seconds:-0}s - not starting a relay run; the schedule will restart it"
          fi
