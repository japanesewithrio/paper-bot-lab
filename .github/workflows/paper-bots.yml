name: Paper Bot Lab

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 13-22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: paper-bot-lab
  cancel-in-progress: false

jobs:
  run-paper-bots:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap project
        shell: bash
        run: |
          if [ -f bot_runner.py ]; then
            echo "Bot project already installed."
            exit 0
          fi

          if [ ! -f paper-bot-lab-production.zip ]; then
            echo "Missing paper-bot-lab-production.zip"
            exit 1
          fi

          TMP_DIR="$(mktemp -d)"
          unzip -q paper-bot-lab-production.zip -d "$TMP_DIR"

          mkdir -p tests reports

          cp "$TMP_DIR/bot_runner.py" .
          cp "$TMP_DIR/bot_state.json" .
          cp "$TMP_DIR/requirements.txt" .
          cp "$TMP_DIR/README.md" .
          cp "$TMP_DIR/tests/test_strategies.py" tests/
          cp "$TMP_DIR/reports/latest.md" reports/

          git config user.name "paper-bot-lab[bot]"
          git config user.email "paper-bot-lab[bot]@users.noreply.github.com"

          git add bot_runner.py bot_state.json requirements.txt README.md
          git add tests/test_strategies.py reports/latest.md

          if ! git diff --cached --quiet; then
            git commit -m "Install Paper Bot Lab"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Check Alpaca secrets
        id: secrets
        shell: bash
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ -n "$ALPACA_API_KEY" ] && [ -n "$ALPACA_SECRET_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Add ALPACA_API_KEY and ALPACA_SECRET_KEY in GitHub Actions secrets."
          fi

      - name: Set up Python
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Safety check
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          if grep -nE \
            'submit_order|MarketOrderRequest|LimitOrderRequest|StopOrderRequest|StopLimitOrderRequest' \
            bot_runner.py
          then
            echo "Broker order code detected. Stopping."
            exit 1
          fi

          echo "Simulation-only safety check passed."

      - name: Run tests
        if: steps.secrets.outputs.ready == 'true'
        run: python -m pytest -q

      - name: Run Paper Bot Lab
        if: steps.secrets.outputs.ready == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python bot_runner.py

      - name: Save bot state
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          if git diff --quiet -- bot_state.json reports/latest.md; then
            echo "No bot-state changes."
            exit 0
          fi

          git config user.name "paper-bot-lab[bot]"
          git config user.email "paper-bot-lab[bot]@users.noreply.github.com"

          git add bot_state.json reports/latest.md
          git commit -m "Update Paper Bot Lab state [skip ci]"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
